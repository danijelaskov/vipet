# Console Appender
appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.disableAnsi = false
appender.console.layout.charset = UTF-8
appender.console.layout.pattern = %d{HH:mm:ss.SSS}   %-5level   %-25t   %-47.47C{1}   %-42.42M   %msg%n

# Rolling File Appender
appender.rolling.type = RollingFile
appender.rolling.name = RollingFile
appender.rolling.fileName = ${sys:log.dir}/vipet.log
appender.rolling.filePattern = ${sys:log.dir}/vipet-%d{yyyy-MM-dd}-%i.log.gz
appender.rolling.append = true
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.charset = UTF-8
appender.rolling.layout.pattern = %d{HH:mm:ss.SSS}   %-5level   %-25t   %-47.47C{1}   %-42.42M   %msg%n

# Triggering Policies
appender.rolling.policies.type = Policies
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 10MB
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 1
appender.rolling.policies.time.modulate = true

# Rollover Strategy
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 5

# Root logger options
rootLogger.level = ${sys:log.level}
rootLogger.appenderRefs = console, rolling
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.rolling.ref = RollingFile