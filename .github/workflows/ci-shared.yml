name: CI (Shared)

on:
  workflow_call:

jobs:
  build-and-test:
    name: Build & Test
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for Gradle wrapper (Unix only)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Install libgtk-3-0 (Ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0

      - name: Build and test under Xvfb (Ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        uses: coactions/setup-xvfb@v1
        with:
          run: ./gradlew build

      - name: Build and test without Xvfb (macOS/Windows)
        if: matrix.os != 'ubuntu-22.04'
        run: ./gradlew build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ runner.os }}
          path: |
            **/build/reports/**
            **/build/test-results/**
